<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG Esperança</title>
</head>

<body>

    <header>
        <h1>Cadastro</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>

        <h2>Cadastre-se</h2>

        <form>
<fieldset>

    <legend>Dados pessoais</legend>

    <label for="nome">Nome completo:</label>
    <input type="text" id="nome" required>
<br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" required>
<br><br>
    <label for="nascimento">Data de nascimento:</label>
    <input type="date" id="nascimento" required>
<br><br>

</fieldset>
   

      
        <fieldset>

    <legend>Endereço</legend>

    <label for="endereco">Endereço:</label>
    <input type="text" id="endereco" required>
    <br><br>

    <label for="cidade">Cidade:</label>
    <input type="text" id="cidade" required>
    <br><br>

    <label for="estado">Estado:</label>
    <input type="text" id="estado" required>
    <br><br>

    <label for="cep">CEP:</label>
<input type="text" id="cep" required pattern="[0-9]{5}-[0-9]{3}">
<br><br>

<label for="telefone">Telefone:</label>
<input type="tel" id="telefone" required pattern="[0-9]{10,11}">
<br><br>

<label for="cpf">CPF:</label>
<input type="text" id="cpf" required pattern="[0-9]{11}">
<br><br>

<label for="mensagem">Mensagem:</label>
<textarea id="mensagem" rows="5" cols="30"></textarea>


</fieldset>
<button type="submit">Cadastrar</button>
        </form>

    </main>

    <footer>
        <p>© 2026 ONG Esperança</p>
    </footer>

</body>

</html>
